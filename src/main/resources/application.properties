# Configuração do Banco de Dados em Memória (H2)
spring.datasource.url=jdbc:h2:mem:dentistadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite que o Spring crie as tabelas (Paciente, Agendamento) automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal os comandos SQL que o Spring está executando
spring.jpa.show-sql=true

# Habilita o Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console